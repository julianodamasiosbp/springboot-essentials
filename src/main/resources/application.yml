spring:
  application:
    name: springboot-essentials
  datasource:
    url: jdbc:mysql://localhost:3306/anime?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  error:
    include-stacktrace: always

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

#springdoc:
#  swagger-ui:
#    disable-swagger-default-url: true
#    path: /swagger-ui.html

springdoc:
  api-docs:
    path: /api-docs
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app: Spring Boot Essentials
  website: https://devdojo.academy
  github: https://github.com/julianodamasiosbp/springboot-essentials
